[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier1: pure functions, no I/O, no network",
    "tier2: real ffmpeg on synthetic fixtures, no API key",
    "tier3: recorded-response replay, no live network",
]
filterwarnings = [
    # google-genai (2.22.0, the latest as of this writing) uses a private
    # CPython typing internal that's slated for removal in Python 3.17.
    # Upstream's bug to fix, not ours - narrowly scoped so a real
    # DeprecationWarning from our own code still surfaces normally.
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The ASS subtitle format's header lines are a fixed external spec, not
# code - splitting them across lines wouldn't make them more readable, it
# would just make them harder to compare against the format's own docs.
"lib/edit.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
